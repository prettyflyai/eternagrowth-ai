<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eterna AI Value Creation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar, then one routed view. Overview = three use-case columns; each use case = tabs (prototype / build guide / business case). */
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eef2ef; --ink:#13201b; --muted:#56655f; --line:#d9e0dc;
  --accent:#14684f; --accent-ink:#ffffff; --accent-soft:#dfeee7;
  --good:#1d7a45; --good-soft:#e1f2e7; --warn:#a8620b; --warn-soft:#fbefdc; --bad:#b0281f; --bad-soft:#f8e3e1;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --ink:#e7eeea; --muted:#9aaba4; --line:#2a3631;
  --accent:#4cc09a; --accent-ink:#06261b; --accent-soft:#183a2f;
  --good:#5cc98a; --good-soft:#163222; --warn:#e3a14a; --warn-soft:#3a2a12; --bad:#f07a70; --bad-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --ink:#e7eeea; --muted:#9aaba4; --line:#2a3631;
  --accent:#4cc09a; --accent-ink:#06261b; --accent-soft:#183a2f;
  --good:#5cc98a; --good-soft:#163222; --warn:#e3a14a; --warn-soft:#3a2a12; --bad:#f07a70; --bad-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:18px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

/* overview */
.hero{padding:40px 0 24px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:end}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.1;max-width:20ch}
.hero p.lede{margin-top:14px;max-width:62ch;color:var(--muted);font-size:16px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font-size:20px;font-family:var(--display);font-weight:600}
.facts span{font-size:12px;color:var(--muted)}
.uc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:8px 0 32px}
.uc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.uc-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);border-top:4px solid var(--accent)}
.uc-head .co{display:flex;justify-content:space-between;gap:8px;align-items:center}
.uc-head h3{font-family:var(--display);font-size:22px;font-weight:600;margin-top:6px}
.uc-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.uc-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.uc-body p{font-size:14px}
.roi{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.roi .big{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1.1}
.roi ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.ttb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ttb div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.ttb b{display:block;font-size:16px}
.ttb span{font-size:11px;color:var(--muted)}
.uc-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.section{margin:12px 0 36px}
.section h2{font-size:24px;margin-bottom:12px}
.portfolio{width:100%;border-collapse:collapse;font-size:14px}
.portfolio th,.portfolio td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.portfolio th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.note{border-left:3px solid var(--warn);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13px;color:var(--muted);max-width:90ch}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.plan .card{padding:14px}
.plan b{display:block;margin-bottom:4px}

/* use case page */
.uc-page-head{padding:24px 0 12px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.uc-page-head h1{font-size:clamp(24px,3vw,34px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.proto-shell{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start;margin-bottom:40px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.app-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.app-bar .t{font-weight:600}
.app-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.app-body{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.kpi.hl b{color:var(--accent)}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.panel-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.panel-b{padding:12px}
.log{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:10px;max-height:220px;overflow:auto;line-height:1.6}
.log div{white-space:pre-wrap}
.log .ok{color:var(--good)}
.log .wn{color:var(--warn)}
.log .ts{color:var(--muted)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.data td.r,table.data th.r{text-align:right}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--surface-2)}
table.data tr.sel td{background:var(--accent-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.detail{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.detail-grid>div{padding:14px;min-width:0}
.detail-grid>div+div{border-left:1px solid var(--line)}
.clause{font-family:var(--display);font-size:15px;background:var(--surface-2);border-radius:6px;padding:12px;line-height:1.55}
.clause mark{background:var(--warn-soft);color:var(--ink);padding:0 2px;border-radius:2px}
.calc{width:100%;font-size:13px;border-collapse:collapse}
.calc td{padding:4px 0;border-bottom:1px dashed var(--line)}
.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.calc tr.tot td{font-weight:600;border-bottom:0;border-top:1px solid var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.letter{white-space:pre-wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:10px}
.contract{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.contract:last-child{border-bottom:0}
.contract b{display:block;font-size:14px}
.terms{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}

/* walkthrough */
.walk{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.walk h3{font-size:14px;margin-bottom:4px}
.walk ol{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.walk li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13px;color:var(--muted)}
.walk li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.walk li.now{color:var(--ink)}
.walk li.now::before{border-color:var(--accent);color:var(--accent)}
.walk li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.walk li b{display:block;color:var(--ink);font-weight:600}
.walk .reset{margin-top:12px}

/* build guide */
.arch{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.arch .node{flex:1 0 150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:13px}
.arch .node b{display:block;font-size:13px;margin-bottom:4px}
.arch .node.ai{border-color:var(--accent);background:var(--accent-soft)}
.arch .arr{align-self:center;color:var(--muted);flex:0 0 auto}
.gantt{display:grid;grid-template-columns:220px repeat(var(--wk),minmax(28px,1fr));font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;min-width:640px}
.gantt>div{padding:6px 8px;border-bottom:1px solid var(--line)}
.gantt .hd{background:var(--surface-2);color:var(--muted);font-weight:600;text-align:center;padding:6px 2px}
.gantt .lbl{background:var(--surface);font-weight:500}
.gantt .cell{background:var(--surface);padding:6px 2px}
.gantt .cell.on{background:var(--accent)}
.gantt .cell.on.ms{background:var(--warn)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step-h{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.step-h .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600}
.step-h .tt{flex:1}
.step-h .tt b{display:block}
.step.done .n{background:var(--accent);color:var(--accent-ink)}
.step-b{padding:0 14px 14px 56px;display:none}
.step.open .step-b{display:block}
.step-b .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.step-b .kv dt{color:var(--muted);font-size:13px}
.step-b .kv dd{margin:0}
.step-b pre{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:10px;border-radius:6px;overflow-x:auto;margin:10px 0 0}
.step-b label{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}

/* calculator */
.calcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:40px}
.slider{margin-bottom:16px}
.slider label{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:4px}
.slider output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.slider input{width:100%;accent-color:var(--accent)}
.out{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.out b{font-variant-numeric:tabular-nums;font-size:18px}
.out.big b{font-family:var(--display);font-size:32px;color:var(--accent)}

/* clerri specifics */
.seg-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg-tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500}
.seg-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.pt:hover{background:var(--surface-2)}
.pt.sel{background:var(--accent-soft)}
.pt .why{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.pt .sc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.compare>div{border:1px solid var(--line);border-radius:8px;padding:10px}
.compare b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.queue{font-size:13px}
.queue div{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}

/* titan specifics */
.map{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:6px}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.alert:hover{background:var(--surface-2)}
.alert.sel{background:var(--accent-soft)}
.alert .sev{border-radius:3px;background:var(--warn)}
.alert .sev.crit{background:var(--bad)}
.alert .sev.ok{background:var(--good)}
.alert b{display:block;font-size:14px}
.hyp{display:grid;grid-template-columns:minmax(0,180px) minmax(60px,1fr) 44px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hyp .ev{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@keyframes pulse{0%{r:5;opacity:1}100%{r:14;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}
@media (max-width:1050px){.uc-grid{grid-template-columns:1fr}.proto-shell{grid-template-columns:1fr}.walk{position:static}.plan{grid-template-columns:1fr 1fr}}
@media (max-width:800px){.hero{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.detail-grid>div+div{border-left:0;border-top:1px solid var(--line)}.calcgrid{grid-template-columns:1fr}.compare{grid-template-columns:1fr}}
@media (max-width:480px){.plan{grid-template-columns:1fr}.nav{margin-left:0}.step-b{padding-left:14px}.step-b .kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#overview"><b>Eterna AI Value Creation Lab</b><span>Prepared by PraxisIQ for Eterna Growth Partners</span></a>
    <nav class="nav" id="nav">
      <a href="#overview" data-r="overview">Overview</a>
      <a href="#pakenergy" data-r="pakenergy">PakEnergy</a>
      <a href="#clerri" data-r="clerri">Clerri</a>
      <a href="#titan-cloud" data-r="titan-cloud">Titan Cloud</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const money = (n, d) => {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (d === "full") return s + "$" + Math.round(a).toLocaleString("en-US");
  if (a >= 1e6) return s + "$" + (a/1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/,"") + "M";
  if (a >= 1e3) return s + "$" + Math.round(a/1e3).toLocaleString("en-US") + "K";
  return s + "$" + Math.round(a);
};
const fmtN = n => Math.round(n).toLocaleString("en-US");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function stamp(){ const d=new Date(); return d.toTimeString().slice(0,8); }
async function streamLog(el, lines, gap=420){
  for (const l of lines){
    const div=document.createElement("div");
    div.innerHTML = `<span class="ts">${stamp()}</span>  <span class="${l.c||""}">${esc(l.t)}</span>`;
    el.appendChild(div); el.scrollTop = el.scrollHeight;
    await sleep(l.d || gap);
  }
}

function walkPanel(title, steps){
  return `<aside class="walk" aria-label="Customer walkthrough">
    <h3>Customer walkthrough</h3><p class="small muted">${title}</p>
    <ol>${steps.map((s,i)=>`<li data-w="${i}" class="${i===0?"now":""}"><span><b>${s[0]}</b>${s[1]}</span></li>`).join("")}</ol>

function walkTo(root, n){
  $$(".walk li", root).forEach((li,i)=>{ li.classList.toggle("done", i<n); li.classList.toggle("now", i===n); });

    $("#alerts",root).innerHTML=TI_ALERTS.map(a=>`<button class="alert ${S.sel===a.id?"sel":""}" data-al="${a.id}"><span class="sev ${S.resolved[a.id]?"ok":a.sev}"></span><span><b>#${a.site} ${a.city} · ${a.title}</b><span class="small muted">${a.sub}</span>${S.resolved[a.id]?'<br><span class="chip good" style="margin-top:4px">Resolved by agent</span>':""}</span></button>`).join("");
    $$("[data-al]",root).forEach(b=>b.onclick=()=>open(b.dataset.al));
  }
  function chart(series){
    const W=520,H=170,p=34, min=Math.min(...series)*1.1, n=series.length;
    const X=i=>p+i*(W-p-10)/(n-1), Y=v=>10+(v/min)*(H-40);
    const pts=series.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const ticks=[0,-100,-200,-300,-400];
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Cumulative variance, falling to −402 gallons over 14 days">
      ${ticks.map(t=>`<line x1="${p}" x2="${W-10}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${p-6}" y="${Y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${t}</text>`).join("")}
      <polygon points="${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}" fill="var(--bad)" opacity=".12"/>
      <polyline points="${pts}" fill="none" stroke="var(--bad)" stroke-width="2"/>
      <circle cx="${X(n-1)}" cy="${Y(series[n-1])}" r="4" fill="var(--bad)"/>
      <line x1="${X(8)}" x2="${X(8)}" y1="10" y2="${H-30}" stroke="var(--warn)" stroke-dasharray="3 3"/>
      <text x="${X(8)+4}" y="22" font-size="10" fill="var(--warn)">Nov 16 delivery −190 gal</text>
      <text x="${p}" y="${H-10}" font-size="10" fill="var(--muted)">Nov 9</text><text x="${W-10}" y="${H-10}" font-size="10" text-anchor="end" fill="var(--muted)">Nov 22</text>
      <text x="${X(1)}" y="${Y(-55)+26}" font-size="10" fill="var(--muted)">steady drift ≈ 15 gal/day</text>
    </svg>`;
  }
  function open(id){
    S.sel=id; drawMap(); alerts();
    const a=TI_ALERTS.find(x=>x.id===id);
    if (id==="a1") walkTo(root, Math.max(2,$$(".walk li.done",root).length));
    $("#inv",root).innerHTML=`
    <div class="detail">
      <div class="panel-h">Site #${a.site} ${a.city} · ${a.title}<span class="chip ${a.sev==="crit"?"bad":"warn"}">${money(a.risk,"full")} annualized at risk</span></div>
      <div class="detail-grid">
        <div><div class="eyebrow" style="margin-bottom:6px">Investigation</div>
          ${S.resolved[id]||S["inv_"+id]?"":`<button class="btn primary" id="go">Investigate with agent</button>`}
          <div class="log" id="ilog" style="margin-top:10px;${S["inv_"+id]?"":"display:none"}"></div>
          ${a.series?`<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:4px">Cumulative variance, Tank 1 (gal)</div>${chart(a.series)}</div>`:""}</div>
        <div id="res">${S["inv_"+id]?results(a):`<div class="empty">The agent will test each likely cause against ATG, delivery, POS and maintenance data, then propose fixes.</div>`}</div>
      </div>
    </div>`;
    if (S["inv_"+id]) { $("#ilog",root).innerHTML=a.steps.map(s=>`<div><span class="ok">✓ ${esc(s)}</span></div>`).join(""); bindActs(a); }
    const go=$("#go",root);
    if (go) go.onclick=async()=>{
      go.disabled=true; go.textContent="Investigating…"; if(id==="a1") walkTo(root,3);
      const log=$("#ilog",root); log.style.display="block";
      await streamLog(log, a.steps.map(s=>({t:s})).concat([{t:"Ranked causes with evidence",c:"ok"}]), 420);
      S["inv_"+id]=true; go.remove(); $("#res",root).innerHTML=results(a); bindActs(a);
    };
  }
  function results(a){
    return `<div class="eyebrow" style="margin-bottom:6px">Likely causes</div>
      ${a.hyp.map(h=>`<div class="hyp"><span>${h[0]}</span><div class="bar ${h[1]>50?"bad":""}"><i style="width:${h[1]}%"></i></div><b class="num small">${h[1]}%</b><span class="ev">${h[2]}</span></div>`).join("")}
      <p class="small" style="margin:12px 0"><b>Root cause:</b> ${a.root}</p>
      <div class="eyebrow" style="margin-bottom:6px">Recommended fixes</div>
      ${a.acts.map((x,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)"><span class="small">${x[0]}${x[2]?` <span class="muted">· ${money(x[2],"full")}</span>`:""}</span><button class="btn sm ${S[a.id+"_"+i]?"":"primary"}" data-act="${i}" ${S[a.id+"_"+i]?"disabled":""}>${S[a.id+"_"+i]?"Done ✓":"Approve"}</button></div>`).join("")}`;
  }
  function bindActs(a){
    $$("[data-act]",root).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.act, x=a.acts[i]; S[a.id+"_"+i]=true; S.saved+=x[2];
      $("#t4",root).textContent=money(S.saved,"full"); toast(x[1]);
      if (a.acts.every((_,j)=>S[a.id+"_"+j])) { S.resolved[a.id]=true; alerts(); drawMap(); if(a.id==="a1") walkTo(root,4); if(TI_ALERTS.every(z=>S.resolved[z.id])) walkTo(root,5); }
      $("#res",root).innerHTML=results(a); bindActs(a);
    });
  }
  drawMap(); alerts();
  $("#inv",root).innerHTML=`<div class="empty" style="margin-top:14px">Select an alert on the map or in the queue to investigate it.</div>`;
};

function renderBuild(body, B){
  const ranges = B.steps.map(s=>{const m=s[1].match(/(\d+)(?:–(\d+))?/); return [+m[1], +(m[2]||m[1])];});

    <h2 style="font-size:20px;margin-bottom:10px">Timeline <span class="small muted" style="font-family:var(--body);font-weight:400">· weeks</span></h2>
    <div class="tablewrap"><div class="gantt" style="--wk:${B.weeks}"><div class="hd" style="text-align:left;padding-left:8px">Workstream</div>${Array.from({length:B.weeks},(_,i)=>`<div class="hd">${i+1}</div>`).join("")}
      ${B.steps.map((s,i)=>`<div class="lbl">${i+1}. ${s[0]}</div>${Array.from({length:B.weeks},(_,w)=>`<div class="cell ${w+1>=ranges[i][0]&&w+1<=ranges[i][1]?"on":""} ${i===B.steps.length-1&&w+1>=ranges[i][0]&&w+1<=ranges[i][1]?"ms":""}"></div>`).join("")}`).join("")}
    </div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px"><h2 style="font-size:20px">Step-by-step build</h2><span class="small muted" id="prog">0 of ${B.steps.length} steps complete</span></div>
    <div class="steps">${B.steps.map((s,i)=>`
      <div class="step ${i===0?"open":""}" data-i="${i}">
        <button class="step-h" aria-expanded="${i===0}"><span class="n">${i+1}</span><span class="tt"><b>${s[0]}</b><span class="small muted">${s[1]}</span></span><span class="muted" aria-hidden="true">▾</span></button>
        <div class="step-b"><dl class="kv">${s[2].map(kv=>`<dt>${kv[0]}</dt><dd>${kv[1]}</dd>`).join("")}</dl>${s[3]?`<pre><code>${esc(s[3])}</code></pre>`:""}
        <label><input type="checkbox" id="chk-${i}"> Mark step complete</label></div>
      </div>`).join("")}</div>
    <div style="height:40px"></div>`;
  $$(".step",body).forEach(st=>{
    $(".step-h",st).onclick=()=>{st.classList.toggle("open"); $(".step-h",st).setAttribute("aria-expanded",st.classList.contains("open"));};
    $("input",st).onchange=e=>{ const i=+st.dataset.i; e.target.checked?done.add(i):done.delete(i); st.classList.toggle("done",e.target.checked); $("#prog",body).textContent=`${done.size} of ${B.steps.length} steps complete`; };
  });
}

function route(){

  const v = $("#view");
  let id = UC.find(u=>h===u.id || h.startsWith(u.id+"-"));
  $$("#nav a").forEach(a=>a.classList.toggle("on", id ? a.dataset.r===id.id : a.dataset.r==="overview"));

  window.scrollTo(0,0);
